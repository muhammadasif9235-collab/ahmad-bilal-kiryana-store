name: Build Ahmad Bilal Kiryana Store APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare Keystore and Firebase Strings
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f app/google-services.json ]; then
            mkdir -p app/src/main/res/values
            if ! grep -rn "default_web_client_id" app/src/main/res/ >/dev/null 2>&1; then
              printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="google_app_id" translatable="false">1:123456789012:android:0123456789abcdef012345</string>\n    <string name="google_api_key" translatable="false">AIzaSyDummyKeyForAndroidAppBuild1234567890</string>\n    <string name="project_id" translatable="false">ahmad-bilal-kiryana-store</string>\n    <string name="gcm_defaultSenderId" translatable="false">123456789012</string>\n    <string name="google_storage_bucket" translatable="false">ahmad-bilal-kiryana-store.appspot.com</string>\n    <string name="default_web_client_id" translatable="false">123456789012-placeholder.apps.googleusercontent.com</string>\n</resources>\n' > app/src/main/res/values/firebase_strings.xml
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ahmad-Bilal-Kiryana-Store-APK
          path: app/build/outputs/apk/debug/*.apk
