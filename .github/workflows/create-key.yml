name: Create Permanent Keystore
on:
  push:
    paths:
      - '.github/workflows/create-key.yml'
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Keystore and SHA-1
        run: |
          mkdir -p key_output
          keytool -genkey -v -keystore key_output/kiryana-release.jks -storepass Kiryana@786 -alias kiryanakey -keypass Kiryana@786 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ahmad Bilal Kiryana Store, OU=Store, O=Tanda Gujrat, L=Gujrat, ST=Punjab, C=PK"
          base64 -w 0 key_output/kiryana-release.jks > key_output/keystore_base64.txt
          keytool -list -v -keystore key_output/kiryana-release.jks -storepass Kiryana@786 -alias kiryanakey | grep -E "SHA1:|SHA256:" > key_output/sha_fingerprints.txt
          cat key_output/sha_fingerprints.txt

      - name: Upload Keystore Package
        uses: actions/upload-artifact@v4
        with:
          name: Kiryana-Permanent-Key
          path: key_output/*
